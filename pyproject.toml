[project]
name = "poetry-homework"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
]

[tool.poetry]
packages = [{include = "poetry_homework", from = "src"}]

[tool.mypy]
strict = true

no_implicit_optional = true
check_untyped_defs = true
warn_unreachable = true

[tool.black]
line-length = 119
skip-string-normalization = true
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | __pycache__
)/
'''

[tool.isort]
line_length = 119
profile = "black"
lines_between_sections = 0
lines_between_types = 0
remove_redundant_aliases = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)"
]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]

#исключить из покрытия тестами из всего проекта. либо коммент по строке/блоку кода: " pragma: no cover "
[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:"
]
